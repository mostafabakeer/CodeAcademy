name: Deploy Client to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: npm run build

      - name: Verify build output (wrangler.toml expects client/dist)
        shell: bash
        run: |
          test -f client/dist/index.html \
            || { echo "::error::client/dist/index.html is missing — Vite output is not at client/dist (wrangler.toml [assets] directory = ./client/dist)"; exit 1; }

      - name: Verify Cloudflare secrets
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" \
            || { echo "::error::Secret CLOUDFLARE_API_TOKEN is missing or empty — create it in Repo Settings -> Secrets and variables -> Actions (Cloudflare -> My Profile -> API Tokens -> Create Token, template 'Edit Cloudflare Workers' with permission Workers Scripts: Edit)"; exit 1; }
          test -n "$CF_ACCOUNT" \
            || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is missing or empty — create it in Repo Settings -> Secrets and variables -> Actions (account id lives in Cloudflare Dashboard, right sidebar on Overview)"; exit 1; }

      - name: Sanitize Cloudflare secrets (strip stray whitespace/newlines)
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN empty"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID empty"; exit 1; }
          printf '%s' "$CF_TOKEN" | tr -d '\r\n\t ' > "$RUNNER_TEMP/cf-token"
          printf '%s' "$CF_ACCOUNT" | tr -d '\r\n\t ' > "$RUNNER_TEMP/cf-account"
          test -s "$RUNNER_TEMP/cf-token" || { echo "::error::CLOUDFLARE_API_TOKEN became empty after sanitize"; exit 1; }
          test -s "$RUNNER_TEMP/cf-account" || { echo "::error::CLOUDFLARE_ACCOUNT_ID became empty after sanitize"; exit 1; }

      - name: Deploy to Cloudflare (wrangler deploy)
        shell: bash
        run: |
          export CLOUDFLARE_API_TOKEN="$(cat "$RUNNER_TEMP/cf-token")"
          export CLOUDFLARE_ACCOUNT_ID="$(cat "$RUNNER_TEMP/cf-account")"
          npx --yes wrangler@4.137.0 deploy