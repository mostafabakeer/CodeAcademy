name: Deploy Client to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client
        working-directory: client
        run: npm ci

      - name: Typecheck client (no emit)
        working-directory: client
        run: npm run typecheck

      - name: Check text encoding (mojibake guard)
        working-directory: client
        run: npm run check:encoding

      - name: Warn when VAPID public key is not configured
        shell: bash
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          # الواجهة تجلب المفتاح من الخادم وقت التشغيل (/push/public-key)، لكن
          # حقنه وقت البناء يقلل طلباً واحداً. نكتفي بالتحذير حتى لا يتوقف النشر.
          if [ -z "$VAPID_PUBLIC" ]; then
            echo "::warning::Secret VAPID_PUBLIC_KEY is empty — the client will fetch it from /push/public-key at runtime. Make sure Supabase secrets VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_SUBJECT are set, otherwise no push will be delivered."
          fi

      - name: Build client
        working-directory: client
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SITE_URL: ${{ secrets.SITE_URL || 'https://codeacademy2.drcode.workers.dev' }}
          # مفتاح VAPID العام مطلوب في الواجهة لتفعيل Web Push (نفس القيمة في Supabase secrets)
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Verify SEO artifacts
        shell: bash
        run: |
          test -f client/dist/robots.txt || { echo "::error::client/dist/robots.txt missing"; exit 1; }
          test -f client/dist/sitemap.xml || { echo "::error::client/dist/sitemap.xml missing"; exit 1; }
          if [ -z "${{ secrets.SITE_URL }}" ]; then
            echo "::warning::Secret SITE_URL is empty — build used the default domain https://codeacademy2.drcode.workers.dev. Set the secret to switch to a custom domain."
          fi

      - name: Verify build output (wrangler.toml expects client/dist)
        shell: bash
        run: |
          # محرك Python في المتصفح: أصول Pyodide تُنسخ قبل البناء من node_modules
          # المسار يحمل رقم الإصدار لكسر أي 404 قديم مخزَّن في متصفحات الطلاب.
          test -f client/dist/py-engine/0.26.4/pyodide.js \
            || { echo "::error::client/dist/py-engine/0.26.4/pyodide.js is missing — copy-pyodide.mjs did not run"; exit 1; }
          test -f client/dist/py-engine/0.26.4/pyodide.asm.wasm \
            || { echo "::error::client/dist/py-engine/0.26.4/pyodide.asm.wasm is missing — Python in CodeLab would break"; exit 1; }
          test -f client/dist/index.html \
            || { echo "::error::client/dist/index.html is missing — Vite output is not at client/dist (wrangler.toml [assets] directory = ./client/dist)"; exit 1; }

      - name: Verify Cloudflare secrets
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" \
            || { echo "::error::Secret CLOUDFLARE_API_TOKEN is missing or empty — create it in Repo Settings -> Secrets and variables -> Actions (Cloudflare -> My Profile -> API Tokens -> Create Token, template 'Edit Cloudflare Workers' with permission Workers Scripts: Edit)"; exit 1; }
          test -n "$CF_ACCOUNT" \
            || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is missing or empty — create it in Repo Settings -> Secrets and variables -> Actions (account id lives in Cloudflare Dashboard, right sidebar on Overview)"; exit 1; }

      - name: Sanitize Cloudflare secrets (strip stray whitespace/newlines)
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN empty"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID empty"; exit 1; }
          printf '%s' "$CF_TOKEN" | tr -d '\r\n\t ' > "$RUNNER_TEMP/cf-token"
          printf '%s' "$CF_ACCOUNT" | tr -d '\r\n\t ' > "$RUNNER_TEMP/cf-account"
          test -s "$RUNNER_TEMP/cf-token" || { echo "::error::CLOUDFLARE_API_TOKEN became empty after sanitize"; exit 1; }
          test -s "$RUNNER_TEMP/cf-account" || { echo "::error::CLOUDFLARE_ACCOUNT_ID became empty after sanitize"; exit 1; }

      - name: Deploy to Cloudflare (wrangler deploy)
        shell: bash
        run: |
          export CLOUDFLARE_API_TOKEN="$(cat "$RUNNER_TEMP/cf-token")"
          export CLOUDFLARE_ACCOUNT_ID="$(cat "$RUNNER_TEMP/cf-account")"
          npx --yes wrangler@4.137.0 deploy

      # إثبات أن ما نُشر هو فعلاً الموقع الذي يفتحه الطلاب. بدون هذه الخطوة
      # نشرنا سابقاً Worker باسم مختلف بينما بقي النطاق الحقيقي بلا Python.
      - name: Smoke test live site (Pyodide must be reachable)
        shell: bash
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://codeacademy2.drcode.workers.dev' }}
        run: |
          base="${SITE_URL%/}"
          # النشر على Cloudflare يصل لحواف (edges) مختلفة على مراحل، فطلب واحد
          # مباشرة بعد wrangler deploy قد يرى النسخة القديمة (404) رغم نجاح النشر.
          # نستخدم HEAD (بلا تحميل 10MB) مع إعادة المحاولة، ونتحقق من نوع المحتوى:
          # الخطأ القديم كان يُرجع صفحة HTML بنجاح 200 لمسار أصل مفقود.
          check_file() {
            local path="$1" want="$2" attempt code ctype headers
            for attempt in 1 2 3 4 5 6 7 8; do
              headers="$(curl -sS -I --max-time 30 "$base$path" 2>/dev/null | tr -d '\r' || true)"
              code="$(printf '%s\n' "$headers" | sed -n 's/^HTTP\/[0-9.]* \([0-9][0-9][0-9]\).*/\1/p' | tail -n1)"
              ctype="$(printf '%s\n' "$headers" | sed -n 's/^[Cc]ontent-[Tt]ype: *//p' | tail -n1)"
              case "$ctype" in
                "$want"*) [ "$code" = "200" ] && { echo "ok  $path ($ctype)"; return 0; } ;;
              esac
              sleep 9
            done
            echo "missing  $path (HTTP ${code:-000}, content-type '${ctype:-none}')"
            return 1
          }

          # نبدأ بملف صغير: لو غير موجود فالنشر بلا أصول ونتخطى بقية الفحوص
          # (كل فحص يعيد المحاولة ~دقيقة، فلا داعي لتكرارها خمس مرات).
          missing=0
          if check_file /py-engine/0.26.4/pyodide-lock.json application/json; then
            check_file /py-engine/0.26.4/pyodide.js text/javascript || missing=1
            check_file /py-engine/0.26.4/pyodide.asm.js text/javascript || missing=1
            check_file /py-engine/0.26.4/pyodide.asm.wasm application/wasm || missing=1
            check_file /py-engine/0.26.4/python_stdlib.zip application/zip || missing=1
          else
            missing=1
          fi

          # الواجهة تتحوّل تلقائياً إلى CDN لو كانت الأصول المحلية ناقصة، فغيابها
          # لا يُعطّل Python. نُسجّل تحذيراً واضحاً (لا فشلاً) ونتأكد أن الاحتياطي
          # (CDN) يعمل — وهو ما سيستخدمه الطالب فعلياً في هذه الحالة.
          if [ "${missing:-0}" = "1" ]; then
            echo "::warning::Pyodide assets are missing from the deployed worker. The app falls back to the pinned jsDelivr CDN, so Python still works, but self-hosting is broken. Check the deploy logs (workers.dev upload limit / Workers Builds) ."
            cdn="https://cdn.jsdelivr.net/npm/pyodide@0.26.4"
            for f in pyodide.js pyodide-lock.json; do
              curl -fsS -I --max-time 30 "$cdn/$f" > /dev/null \
                || { echo "::error::CDN fallback $cdn/$f is unreachable — Python would not work at all"; exit 1; }
            done
            echo "Python will load from the CDN fallback."
          fi

          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 30 "$base/" > /dev/null; then break; fi
            [ "$attempt" = 5 ] && { echo "::error::$base/ is not reachable"; exit 1; }
            sleep 9
          done
          echo "Smoke test passed: $base serves the Python engine."

      # كشف انحراف الواجهة عن الباك اند: الـ API يُنشر يدوياً، فقد تتقدّم الواجهة
      # بميزة (مثل Python) بينما الخادم قديم. تحذير واضح بدل فشل صامت للمستخدم.
      - name: Check deployed API version (drift warning)
        shell: bash
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://codeacademy2.drcode.workers.dev' }}
        run: |
          expected="$(sed -n "s/.*API_VERSION = '\([^']*\)'.*/\1/p" supabase/functions/_shared/version.ts | head -n1)"
          echo "Expected API_VERSION from repo: ${expected:-<unknown>}"
          actual=""
          for i in 1 2 3 4 5; do
            actual="$(curl -fsS --max-time 10 "${SITE_URL%/}/api/version" 2>/dev/null | sed -n 's/.*"apiVersion":"\([^"]*\)".*/\1/p' || true)"
            [ -n "$actual" ] && break
            sleep 3
          done
          if [ -z "$actual" ]; then
            echo "::warning::Could not read ${SITE_URL%/}/version — backend may be down or /version not deployed yet."
          elif [ -n "$expected" ] && [ "$actual" != "$expected" ]; then
            echo "::warning::Backend drift: deployed apiVersion=$actual but repo expects $expected. Run the 'Deploy Backend' workflow (Actions -> Deploy Backend) to deploy Supabase functions/migrations."
          else
            echo "Backend version matches: $actual"
          fi
