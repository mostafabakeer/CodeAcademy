# تطبيق ملف SQL واحد على قاعدة Supabase عبر Management API.
#
# لماذا؟ `supabase db push` في deploy-backend.yml يحتاج سرّ SUPABASE_DB_PASSWORD
# وهو غير مضبوط، فتخطّى الميجريشنز في كل نشر. هذا الـ workflow يدوي فقط
# (workflow_dispatch) ويستخدم SUPABASE_ACCESS_TOKEN الموجود أصلاً لتشغيل
# الملف المطلوب — آمن لأنه لا يعمل تلقائياً على أي push.
name: Apply SQL Migration

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'مسار ملف SQL داخل المستودع'
        required: true
        default: 'supabase/migrations/016_perf_rpcs.sql'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN و SUPABASE_PROJECT_ID مطلوبان."
            exit 1
          fi

      - name: Apply SQL via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          MIGRATION_FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          if [ ! -f "$MIGRATION_FILE" ]; then
            echo "::error::الملف غير موجود: $MIGRATION_FILE"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');

          const file = process.env.MIGRATION_FILE;
          const project = process.env.SUPABASE_PROJECT_ID;
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const sql = fs.readFileSync(file, 'utf8');

          const url = `https://api.supabase.com/v1/projects/${project}/database/query`;

          (async () => {
            const res = await fetch(url, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ query: sql }),
            });
            const text = await res.text();
            console.log(`HTTP ${res.status}`);
            console.log(text.slice(0, 4000));
            if (!res.ok) {
              console.error(`::error::فشل تطبيق ${file}`);
              process.exit(1);
            }
            console.log(`✔ طُبّق ${file}`);
          })().catch((e) => {
            console.error('::error::' + (e && e.message ? e.message : e));
            process.exit(1);
          });
          NODE
