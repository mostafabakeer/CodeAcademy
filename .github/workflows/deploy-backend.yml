name: Deploy Backend (Supabase)

# الباك اند (Edge Functions + الميجريشنز).
#
# - عند الدفع على main: تُنشر الدوال فقط تلقائياً (بدون ميجريشنز) لأن تغيير
#   القاعدة يحتاج مراجعة يدوية. بدون ذلك ظلّت إصلاحات مثل إشعارات الامتحانات
#   حبيسة الريبو بينما الموقع الحي يعمل بنسخة قديمة.
# - يدوياً: يمكن اختيار تطبيق الميجريشنز ونشر دوال محددة.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'تطبيق ميجريشنز القاعدة أولاً (supabase db push)'
        type: boolean
        default: true
      functions:
        description: 'الدوال المطلوب نشرها (مسافة بين كل اسم)'
        type: string
        default: 'api backup cleanup'

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # عند الدفع التلقائي لا توجد inputs: ننشر كل الدوال ونمنع الميجريشنز.
      FUNCTIONS: ${{ inputs.functions || 'api backup cleanup' }}
      RUN_MIGRATIONS: ${{ inputs.run_migrations || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Supabase credentials
        id: pre
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping backend deploy — SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_ID secrets are missing. Add them (Account -> Access Tokens, Project Settings -> Reference ID) to deploy automatically. Until then deploy manually: supabase functions deploy api --project-ref <ref> --no-verify-jwt"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Link project
        if: ${{ steps.pre.outputs.ok == 'true' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply database migrations
        if: ${{ steps.pre.outputs.ok == 'true' && env.RUN_MIGRATIONS == 'true' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Verify Web Push secrets (warning only)
        if: ${{ steps.pre.outputs.ok == 'true' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          list="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_ID" 2>/dev/null || true)"
          for key in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do
            if echo "$list" | grep -q "$key"; then
              echo "✓ $key is set"
            else
              echo "::warning::Supabase secret $key is missing — Web Push notifications will be disabled. Generate keys with: npx web-push generate-vapid-keys"
            fi
          done

      - name: Deploy Edge Functions
        if: ${{ steps.pre.outputs.ok == 'true' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for fn in ${{ env.FUNCTIONS }}; do
            echo "Deploying function: $fn"
            supabase functions deploy "$fn" --no-verify-jwt
          done

      - name: Verify deployed API version
        if: ${{ steps.pre.outputs.ok == 'true' }}
        shell: bash
        env:
          API_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/api
        run: |
          expected="$(sed -n "s/.*API_VERSION = '\([^']*\)'.*/\1/p" supabase/functions/_shared/version.ts | head -n1)"
          echo "Expected API_VERSION: ${expected:-<unknown>}"
          actual=""
          for i in 1 2 3 4 5 6; do
            actual="$(curl -fsS --max-time 10 "${API_URL}/version" 2>/dev/null | sed -n 's/.*"apiVersion":"\([^"]*\)".*/\1/p' || true)"
            [ -n "$actual" ] && break
            sleep 5
          done
          if [ -z "$actual" ]; then
            echo "::error::Could not read ${API_URL}/version after deploy"
            exit 1
          fi
          if [ -n "$expected" ] && [ "$actual" != "$expected" ]; then
            echo "::error::Deployed apiVersion=$actual but repo expects $expected."
            exit 1
          fi
          echo "Backend deployed and verified: $actual"

      - name: Health check
        if: ${{ steps.pre.outputs.ok == 'true' }}
        shell: bash
        env:
          API_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/api
        run: |
          curl -fsS --max-time 15 "${API_URL}/health" | tee /tmp/health.json
          grep -q '"db":"up"' /tmp/health.json \
            || { echo "::error::Database health check failed"; exit 1; }
