services:
  drcode:
    build: .
    image: drcode:latest
    container_name: drcode
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      # !!! املأ من Supabase Dashboard → Project Settings → API !!!
      - JWT_SECRET=غيّرني-إلى-سلسلة-عشوائية-طويلة
      - SUPABASE_URL=https://xxxx.supabase.co
      - SUPABASE_SERVICE_ROLE_KEY=eyJ...
      - SUPABASE_BUCKET_VIDEOS=videos
      - SUPABASE_BUCKET_IMAGES=images
      - SUPABASE_BUCKET_BACKUPS=backups
      - SEED_ON_START=false
