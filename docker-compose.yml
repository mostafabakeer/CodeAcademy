services:
  drcode:
    build: .
    image: drcode:latest
    container_name: drcode
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      # !!! غيّر القيم دي من ملف server/.env عندك !!!
      - JWT_SECRET=غيّرني-إلى-سلسلة-عشوائية-طويلة
      - TELEGRAM_BOT_TOKEN=ضع-توكن-البوت-هنا
      - TELEGRAM_CHANNEL_ID=ضع-رقم-القناة-هنا
      - RESYNC_ON_START=false
    volumes:
      - drcode_data:/app/server/data
      - drcode_uploads:/app/server/uploads

volumes:
  drcode_data:
  drcode_uploads:
